<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intervention UI Demo</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🧠 Intervention UI Demo</h1>
      <p class="subtitle">Standalone intervention components for productivity applications</p>
    </div>

    <!-- Intervention Demo Section -->
    <div class="intervention-demo-section glass-card">
      <h3><i data-lucide="lightbulb"></i> Try the Interventions</h3>
      <p class="section-description">Click any button below to see the intervention in action</p>

      <div class="demo-buttons">
        <button class="demo-btn" data-intervention="5_second_rule">
          <i data-lucide="zap"></i>
          <span>5-Second Rule</span>
        </button>
        <button class="demo-btn" data-intervention="pomodoro">
          <i data-lucide="timer"></i>
          <span>Pomodoro</span>
        </button>
        <button class="demo-btn" data-intervention="breathing">
          <i data-lucide="wind"></i>
          <span>Breathing Exercise</span>
        </button>
        <button class="demo-btn" data-intervention="visualization">
          <i data-lucide="eye"></i>
          <span>Visualization</span>
        </button>
        <button class="demo-btn" data-intervention="reframe">
          <i data-lucide="refresh-cw"></i>
          <span>Reframe</span>
        </button>
      </div>
    </div>



  <!-- Load modules -->
  <script src="modules/interventionUI.js"></script>
  <script src="renderer.js"></script>

  <!-- Initialize Lucide Icons -->
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>

</html>
